apiVersion: apps/v1
kind: Deployment
metadata:
  name: msg-chat-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: msg-chat-frontend
  template:
    metadata:
      labels:
        app: msg-chat-frontend
      annotations:
        redeploy-timestamp: "23.7.2025 12:33"
    spec:
      containers:
        - name: msg-chat-frontend
          image: msg-chat-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: msg-chat-frontend
spec:
  type: NodePort
  selector:
    app: msg-chat-frontend
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: msg-chat-frontend
