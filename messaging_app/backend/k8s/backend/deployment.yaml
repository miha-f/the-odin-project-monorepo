apiVersion: apps/v1
kind: Deployment
metadata:
  name: msg-chat-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: msg-chat-backend
  template:
    metadata:
      labels:
        app: msg-chat-backend
      annotations:
        redeploy-timestamp: "23.7.2025 12:33"
    spec:
      containers:
        - name: msg-chat-backend
          image: msg-chat-backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: DATABASE_URL
              value: postgres://postgres:postgres@my-postgres-postgresql:5432/messaging_app?sslmode=disable
            - name: REDIS_ADDR
              value: my-redis-master:6379
---
apiVersion: v1
kind: Service
metadata:
  name: msg-chat-backend
spec:
  type: NodePort
  selector:
    app: msg-chat-backend
  ports:
    - protocol: TCP
      port: 8081      
      targetPort: 8081 
      nodePort: 30082    
