version: "2"
sql:
  - engine: "postgresql"
    schema: "./internal/db/schema.sql"
    queries: "./internal/db/queries.sql"
    gen:
      go:
        package: "postgres"
        out: "./internal/db/postgres"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
